name: GitHub Crawler CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # -------------------------------
  # 1. Run Unit Tests
  # -------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        env:
          GITHUB_TOKEN: "dummy_test_token"   # ✅ prevent import error
        run: |
          source venv/bin/activate
          pytest -q

  # -------------------------------
  # 2. Run Crawler Demo
  # -------------------------------
  crawl:
    runs-on: ubuntu-latest
    needs: test   # only run if tests pass
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: crawler
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: crawlerdb
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U crawler"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt

      - name: Initialize database schema
        run: |
          PGPASSWORD=secret psql -h localhost -U crawler -d crawlerdb -f schema.sql

      - name: Run crawler (demo)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # ✅ real token for actual crawl
          DATABASE_URL: postgresql://crawler:secret@localhost:5432/crawlerdb
          TARGET_REPOS: 500
          MONTHS_BACK: 3
        run: |
          source venv/bin/activate
          python -m crawler.main

