name: GitHub Crawler CI

on:
  push:
  pull_request:
  workflow_dispatch:   # ✅ allows manual trigger for full crawl

jobs:
  # -------------------------------
  # 1. Run Unit Tests
  # -------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        env:
          GITHUB_TOKEN: "dummy_test_token"
        run: |
          source venv/bin/activate
          pytest -q

  # -------------------------------
  # 2. Run Crawler Demo (small scale)
  # -------------------------------
  crawl:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: crawler
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: crawlerdb
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U crawler"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt

      - name: Initialize database schema
        run: |
          PGPASSWORD=secret psql -h localhost -U crawler -d crawlerdb -f schema.sql

      - name: Run crawler (demo)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATABASE_URL: postgresql://crawler:secret@localhost:5432/crawlerdb
          TARGET_REPOS: 500
          MONTHS_BACK: 3
        run: |
          source venv/bin/activate
          python -m crawler.main

  # -------------------------------
  # 3. Full Crawl (100k repos, manual trigger only)
  # -------------------------------
  crawl-100k:
    if: github.event_name == 'workflow_dispatch'   # ✅ only run manually
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: crawler
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: crawlerdb
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U crawler"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt

      - name: Initialize database schema
        run: |
          PGPASSWORD=secret psql -h localhost -U crawler -d crawlerdb -f schema.sql

      - name: Run crawler (100k repos)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATABASE_URL: postgresql://crawler:secret@localhost:5432/crawlerdb
          TARGET_REPOS: 100000
          MONTHS_BACK: 12
        run: |
          source venv/bin/activate
          python -m crawler.main

      # Export PostgreSQL DB → SQL file
      - name: Dump PostgreSQL database
        run: |
          PGPASSWORD=secret pg_dump -h localhost -U crawler -d crawlerdb > repos.sql

      # Export repos table → JSON
      - name: Export repos to JSON
        run: |
          PGPASSWORD=secret psql -h localhost -U crawler -d crawlerdb -t -A -F json -c "SELECT json_agg(repositories) FROM repositories;" > repos.json

      # Upload artifacts
      - name: Upload crawl results
        uses: actions/upload-artifact@v4
        with:
          name: github-repos-100k
          path: |
            repos.sql
            repos.json
